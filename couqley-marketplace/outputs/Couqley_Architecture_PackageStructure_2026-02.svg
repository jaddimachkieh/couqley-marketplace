<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="Georgia, serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CC3333"/>
      <stop offset="100%" stop-color="#B42D2D"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF8F0"/>
      <stop offset="100%" stop-color="#F7F3E9"/>
    </linearGradient>
    <linearGradient id="skillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF7F0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" rx="16" fill="url(#creamGrad)" stroke="#BF9966" stroke-width="3"/>

  <!-- Header -->
  <rect x="0" y="0" width="1100" height="90" rx="16" fill="url(#headerGrad)"/>
  <rect x="0" y="50" width="1100" height="40" fill="url(#headerGrad)"/>
  <text x="550" y="38" text-anchor="middle" fill="white" font-size="32" font-weight="bold" letter-spacing="6">COUQLEY</text>
  <text x="550" y="62" text-anchor="middle" fill="#BF9966" font-size="12" font-weight="bold" letter-spacing="4">FRENCH BISTRO</text>
  <text x="550" y="82" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13" letter-spacing="1">Package Architecture — Siloed Skills</text>

  <!-- Gold decorative line -->
  <line x1="40" y1="105" x2="1060" y2="105" stroke="#BF9966" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- ========== BRAND SKILL (top center) ========== -->
  <rect x="380" y="118" width="340" height="54" rx="8" fill="url(#skillGrad)" stroke="#BF9966" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="406" cy="145" r="14" fill="#BF9966" opacity="0.15"/>
  <text x="406" y="150" text-anchor="middle" fill="#BF9966" font-size="15">🎨</text>
  <text x="430" y="140" fill="#CC3333" font-size="14" font-weight="bold">couqley-brand</text>
  <text x="430" y="158" fill="#666" font-size="10">Shared reference — colors, fonts, tone guidelines</text>

  <!-- Dashed lines from brand to each skill -->
  <line x1="440" y1="172" x2="180" y2="225" stroke="#BF9966" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="500" y1="172" x2="460" y2="225" stroke="#BF9966" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="600" y1="172" x2="740" y2="225" stroke="#BF9966" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="660" y1="172" x2="1000" y2="225" stroke="#BF9966" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- ========== SKILL 1: MENU ENGINEER ========== -->
  <g transform="translate(30, 225)">
    <rect width="240" height="290" rx="10" fill="url(#skillGrad)" stroke="#CC3333" stroke-width="2.5" filter="url(#shadow)"/>
    <!-- Skill header -->
    <rect width="240" height="42" rx="10" fill="#CC3333"/>
    <rect y="20" width="240" height="22" fill="#CC3333"/>
    <text x="120" y="28" text-anchor="middle" fill="white" font-size="13" font-weight="bold" letter-spacing="1">MENU ENGINEER</text>

    <!-- Input -->
    <text x="16" y="62" fill="#BF9966" font-size="9" font-weight="bold" letter-spacing="1">INPUT</text>
    <rect x="12" y="68" width="216" height="28" rx="5" fill="#F7F3E9" stroke="#BF9966" stroke-width="1"/>
    <text x="22" y="86" fill="#333" font-size="10">📄 Menu Engineering CSV</text>
    <text x="168" y="86" fill="#888" font-size="8">(REP_S_00506)</text>

    <!-- Scripts -->
    <text x="16" y="114" fill="#BF9966" font-size="9" font-weight="bold" letter-spacing="1">SCRIPTS</text>
    <rect x="12" y="120" width="216" height="22" rx="4" fill="#FFF9F0" stroke="#E4D2B4" stroke-width="1"/>
    <text x="22" y="135" fill="#555" font-size="10">parse.py → parse CSV format</text>
    <rect x="12" y="146" width="216" height="22" rx="4" fill="#FFF9F0" stroke="#E4D2B4" stroke-width="1"/>
    <text x="22" y="161" fill="#555" font-size="10">analyze.py → Boston Matrix</text>

    <!-- Output -->
    <text x="16" y="188" fill="#BF9966" font-size="9" font-weight="bold" letter-spacing="1">OUTPUT</text>
    <rect x="12" y="194" width="216" height="22" rx="4" fill="#F0FFF0" stroke="#8CBF8C" stroke-width="1"/>
    <text x="22" y="209" fill="#2D6B2D" font-size="10">📊 dashboard.html</text>

    <!-- Key features -->
    <text x="16" y="235" fill="#BF9966" font-size="9" font-weight="bold" letter-spacing="1">DELIVERS</text>
    <text x="18" y="252" fill="#555" font-size="9">• Boston Matrix classification</text>
    <text x="18" y="265" fill="#555" font-size="9">• Challenge item marketing plays</text>
    <text x="18" y="278" fill="#555" font-size="9">• Profit optimization scenarios</text>
  </g>

  <!-- ========== SKILL 2: SALES ========== -->
  <g transform="translate(295, 225)">
    <rect width="240" height="290" rx="10" fill="url(#skillGrad)" stroke="#CC3333" stroke-width="2.5" filter="url(#shadow)"/>
    <rect width="240" height="42" rx="10" fill="#CC3333"/>
    <rect y="20" width="240" height="22" fill="#CC3333"/>
    <text x="120" y="28" text-anchor="middle" fill="white" font-size="13" font-weight="bold" letter-spacing="1">SALES ANALYSIS</text>

    <text x="16" y="62" fill="#BF9966" font-size="9" font-weight="bold" letter-spacing="1">INPUT</text>
    <rect x="12" y="68" width="216" height="28" rx="5" fill="#F7F3E9" stroke="#BF9966" stroke-width="1"/>
    <text x="22" y="86" fill="#333" font-size="10">📄 Sales Report CSV</text>
    <text x="162" y="86" fill="#888" font-size="8">(REP_S_00001)</text>

    <text x="16" y="114" fill="#BF9966" font-size="9" font-weight="bold" letter-spacing="1">SCRIPTS</text>
    <rect x="12" y="120" width="216" height="22" rx="4" fill="#FFF9F0" stroke="#E4D2B4" stroke-width="1"/>
    <text x="22" y="135" fill="#555" font-size="10">parse.py → parse Sales CSV</text>
    <rect x="12" y="146" width="216" height="22" rx="4" fill="#FFF9F0" stroke="#E4D2B4" stroke-width="1"/>
    <text x="22" y="161" fill="#555" font-size="10">analyze.py → rankings &amp; trends</text>

    <text x="16" y="188" fill="#BF9966" font-size="9" font-weight="bold" letter-spacing="1">OUTPUT</text>
    <rect x="12" y="194" width="216" height="22" rx="4" fill="#F0FFF0" stroke="#8CBF8C" stroke-width="1"/>
    <text x="22" y="209" fill="#2D6B2D" font-size="10">📊 dashboard.html</text>

    <text x="16" y="235" fill="#BF9966" font-size="9" font-weight="bold" letter-spacing="1">DELIVERS</text>
    <text x="18" y="252" fill="#555" font-size="9">• Top/bottom item rankings</text>
    <text x="18" y="265" fill="#555" font-size="9">• Group performance breakdown</text>
    <text x="18" y="278" fill="#555" font-size="9">• Promotion candidates</text>
  </g>

  <!-- ========== SKILL 3: BREAKEVEN ========== -->
  <g transform="translate(560, 225)">
    <rect width="240" height="290" rx="10" fill="url(#skillGrad)" stroke="#CC3333" stroke-width="2.5" filter="url(#shadow)"/>
    <rect width="240" height="42" rx="10" fill="#CC3333"/>
    <rect y="20" width="240" height="22" fill="#CC3333"/>
    <text x="120" y="28" text-anchor="middle" fill="white" font-size="13" font-weight="bold" letter-spacing="1">BREAK-EVEN</text>

    <text x="16" y="62" fill="#BF9966" font-size="9" font-weight="bold" letter-spacing="1">INPUT</text>
    <rect x="12" y="68" width="216" height="28" rx="5" fill="#F7F3E9" stroke="#BF9966" stroke-width="1"/>
    <text x="22" y="86" fill="#333" font-size="10">📊 Accounting Excel</text>
    <text x="178" y="86" fill="#888" font-size="8">(.xlsx)</text>

    <text x="16" y="114" fill="#BF9966" font-size="9" font-weight="bold" letter-spacing="1">SCRIPTS</text>
    <rect x="12" y="120" width="216" height="22" rx="4" fill="#FFF9F0" stroke="#E4D2B4" stroke-width="1"/>
    <text x="22" y="135" fill="#555" font-size="10">parse.py → parse Accounting</text>
    <rect x="12" y="146" width="216" height="22" rx="4" fill="#FFF9F0" stroke="#E4D2B4" stroke-width="1"/>
    <text x="22" y="161" fill="#555" font-size="10">analyze.py → forecast engine</text>

    <text x="16" y="188" fill="#BF9966" font-size="9" font-weight="bold" letter-spacing="1">OUTPUT</text>
    <rect x="12" y="194" width="216" height="22" rx="4" fill="#F0FFF0" stroke="#8CBF8C" stroke-width="1"/>
    <text x="22" y="209" fill="#2D6B2D" font-size="10">📊 dashboard.html</text>

    <text x="16" y="235" fill="#BF9966" font-size="9" font-weight="bold" letter-spacing="1">DELIVERS</text>
    <text x="18" y="252" fill="#555" font-size="9">• Monthly P&amp;L summary</text>
    <text x="18" y="265" fill="#555" font-size="9">• Break-even point calculation</text>
    <text x="18" y="278" fill="#555" font-size="9">• 12-month growth forecast</text>
  </g>

  <!-- ========== SKILL 4: PAYROLL ========== -->
  <g transform="translate(825, 225)">
    <rect width="240" height="290" rx="10" fill="url(#skillGrad)" stroke="#CC3333" stroke-width="2.5" filter="url(#shadow)"/>
    <rect width="240" height="42" rx="10" fill="#CC3333"/>
    <rect y="20" width="240" height="22" fill="#CC3333"/>
    <text x="120" y="28" text-anchor="middle" fill="white" font-size="13" font-weight="bold" letter-spacing="1">PAYROLL</text>

    <text x="16" y="62" fill="#BF9966" font-size="9" font-weight="bold" letter-spacing="1">INPUT</text>
    <rect x="12" y="68" width="216" height="28" rx="5" fill="#F7F3E9" stroke="#BF9966" stroke-width="1"/>
    <text x="22" y="86" fill="#333" font-size="10">📊 Payroll Excel</text>
    <text x="178" y="86" fill="#888" font-size="8">(.xlsx)</text>

    <text x="16" y="114" fill="#BF9966" font-size="9" font-weight="bold" letter-spacing="1">SCRIPTS</text>
    <rect x="12" y="120" width="216" height="22" rx="4" fill="#FFF9F0" stroke="#E4D2B4" stroke-width="1"/>
    <text x="22" y="135" fill="#555" font-size="10">parse.py → parse Payroll</text>
    <rect x="12" y="146" width="216" height="22" rx="4" fill="#FFF9F0" stroke="#E4D2B4" stroke-width="1"/>
    <text x="22" y="161" fill="#555" font-size="10">analyze.py → cost analysis</text>

    <text x="16" y="188" fill="#BF9966" font-size="9" font-weight="bold" letter-spacing="1">OUTPUT</text>
    <rect x="12" y="194" width="216" height="22" rx="4" fill="#F0FFF0" stroke="#8CBF8C" stroke-width="1"/>
    <text x="22" y="209" fill="#2D6B2D" font-size="10">📊 dashboard.html</text>

    <text x="16" y="235" fill="#BF9966" font-size="9" font-weight="bold" letter-spacing="1">DELIVERS</text>
    <text x="18" y="252" fill="#555" font-size="9">• Department cost breakdown</text>
    <text x="18" y="265" fill="#555" font-size="9">• Top earner rankings</text>
    <text x="18" y="278" fill="#555" font-size="9">• Staffing trend insights</text>
  </g>

  <!-- ========== BOTTOM SECTION: Shared folders ========== -->
  <line x1="40" y1="540" x2="1060" y2="540" stroke="#BF9966" stroke-width="1.5" stroke-dasharray="8,4"/>

  <text x="550" y="568" text-anchor="middle" fill="#CC3333" font-size="14" font-weight="bold" letter-spacing="2">SHARED RESOURCES</text>

  <!-- reports/ -->
  <g transform="translate(80, 585)">
    <rect width="280" height="65" rx="8" fill="url(#skillGrad)" stroke="#BF9966" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="18" y="24" fill="#CC3333" font-size="13" font-weight="bold">reports/</text>
    <text x="18" y="42" fill="#555" font-size="10">Uploaded Omega POS files land here.</text>
    <text x="18" y="55" fill="#888" font-size="9">CSV (menu, sales) &amp; Excel (accounting, payroll)</text>
  </g>

  <!-- outputs/ -->
  <g transform="translate(410, 585)">
    <rect width="280" height="65" rx="8" fill="url(#skillGrad)" stroke="#BF9966" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="18" y="24" fill="#CC3333" font-size="13" font-weight="bold">outputs/</text>
    <text x="18" y="42" fill="#555" font-size="10">Generated dashboards saved here.</text>
    <text x="18" y="55" fill="#888" font-size="9">Branded HTML with Chart.js visualizations</text>
  </g>

  <!-- reference/ -->
  <g transform="translate(740, 585)">
    <rect width="280" height="65" rx="8" fill="url(#skillGrad)" stroke="#BF9966" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="18" y="24" fill="#CC3333" font-size="13" font-weight="bold">reference/</text>
    <text x="18" y="42" fill="#555" font-size="10">Data format specs &amp; content templates.</text>
    <text x="18" y="55" fill="#888" font-size="9">Omega report formats, marketing templates</text>
  </g>

  <!-- ========== DATA FLOW ARROWS ========== -->
  <!-- Arrows from reports → each skill -->
  <defs>
    <marker id="arrowGold" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#BF9966"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8CBF8C"/>
    </marker>
  </defs>

  <!-- Flow label -->
  <text x="550" y="695" text-anchor="middle" fill="#CC3333" font-size="14" font-weight="bold" letter-spacing="2">DATA FLOW</text>

  <!-- Flow diagram -->
  <g transform="translate(100, 710)">
    <!-- Upload box -->
    <rect width="130" height="40" rx="6" fill="#F7F3E9" stroke="#BF9966" stroke-width="1.5"/>
    <text x="65" y="25" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">Upload Report</text>

    <!-- Arrow 1 -->
    <line x1="135" y1="20" x2="195" y2="20" stroke="#BF9966" stroke-width="2" marker-end="url(#arrowGold)"/>

    <!-- Skill auto-parse -->
    <rect x="200" y="0" width="165" height="40" rx="6" fill="#CC3333"/>
    <text x="282" y="25" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Skill Auto-Parses</text>

    <!-- Arrow 2 -->
    <line x1="370" y1="20" x2="430" y2="20" stroke="#BF9966" stroke-width="2" marker-end="url(#arrowGold)"/>

    <!-- Analysis -->
    <rect x="435" y="0" width="130" height="40" rx="6" fill="#BF9966"/>
    <text x="500" y="25" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Analysis</text>

    <!-- Arrow 3 -->
    <line x1="570" y1="20" x2="630" y2="20" stroke="#8CBF8C" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- Dashboard -->
    <rect x="635" y="0" width="175" height="40" rx="6" fill="#F0FFF0" stroke="#8CBF8C" stroke-width="1.5"/>
    <text x="722" y="25" text-anchor="middle" fill="#2D6B2D" font-size="11" font-weight="bold">Branded Dashboard</text>
  </g>

  <!-- Footer -->
  <text x="550" y="795" text-anchor="middle" fill="#999" font-size="10">Couqley French Bistro — Package Architecture v2.0 — February 2026</text>
  <line x1="40" y1="775" x2="1060" y2="775" stroke="#BF9966" stroke-width="1" opacity="0.4"/>
</svg>
