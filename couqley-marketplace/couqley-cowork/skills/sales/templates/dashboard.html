<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couqley Sales Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background-color: #F7F3E9;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
            border: 3px solid #BF9966;
            border-radius: 12px;
            padding: 40px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #BF9966;
            padding-bottom: 20px;
        }

        .header-brand {
            font-size: 48px;
            font-weight: bold;
            color: #CC3333;
            margin-bottom: 5px;
        }

        .header-tagline {
            font-size: 16px;
            color: #BF9966;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .header-title {
            font-size: 32px;
            color: #333;
            margin-bottom: 8px;
        }

        .header-period {
            font-size: 14px;
            color: #666;
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .metric-card {
            background: linear-gradient(135deg, #F7F3E9 0%, #FEFBF7 100%);
            border: 2px solid #BF9966;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(204, 51, 51, 0.15);
        }

        .metric-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 28px;
            font-weight: bold;
            color: #CC3333;
        }

        /* Section Headers */
        .section-header {
            background-color: #CC3333;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 40px;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        /* Chart Containers */
        .chart-container {
            background-color: white;
            border: 2px solid #BF9966;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            position: relative;
            height: 400px;
        }

        .chart-container.doughnut {
            height: 350px;
        }

        canvas {
            max-height: 100%;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            margin-bottom: 20px;
        }

        thead {
            background-color: #CC3333;
            color: white;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #F0F0F0;
        }

        tbody tr:hover {
            background-color: #F7F3E9;
        }

        tbody tr:nth-child(even) {
            background-color: #FEFBF7;
        }

        /* Insight Cards */
        .insights-container {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .insight-card {
            background-color: #F7F3E9;
            border-left: 4px solid #CC3333;
            border-radius: 4px;
            padding: 15px;
            position: relative;
        }

        .insight-card.positive {
            border-left-color: #4CAF50;
        }

        .insight-card.warning {
            border-left-color: #FF9800;
        }

        .insight-card.opportunity {
            border-left-color: #2196F3;
        }

        .insight-icon {
            display: inline-block;
            margin-right: 8px;
            font-size: 18px;
        }

        .insight-title {
            font-size: 13px;
            font-weight: bold;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .insight-text {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
        }

        /* Footer */
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #BF9966;
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .header-brand {
                font-size: 36px;
            }

            .header-title {
                font-size: 24px;
            }

            .metric-value {
                font-size: 22px;
            }

            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .chart-container {
                height: 300px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-brand">COUQLEY</div>
            <div class="header-tagline">FRENCH BISTRO</div>
            <div class="header-title">Sales Analysis</div>
            <div class="header-period"><!-- DATA:period --></div>
        </div>

        <!-- Key Metrics -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Total Revenue</div>
                <div class="metric-value">$<!-- DATA:total_revenue --></div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Top Item</div>
                <div class="metric-value"><!-- DATA:top_item_name --></div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Total Items Sold</div>
                <div class="metric-value"><!-- DATA:total_items_sold --></div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Unique Items</div>
                <div class="metric-value"><!-- DATA:unique_items --></div>
            </div>
        </div>

        <!-- Top 10 Items -->
        <div class="section-header">Top 10 Items by Revenue</div>
        <div class="chart-container">
            <canvas id="topItemsChart"></canvas>
        </div>

        <!-- Group Performance -->
        <div class="section-header">Group Performance</div>
        <div class="chart-container doughnut">
            <canvas id="groupChart"></canvas>
        </div>

        <!-- Slow Movers & Promotion Candidates Table -->
        <div class="section-header">Promotion Opportunities</div>
        <table>
            <thead>
                <tr>
                    <th>Item Name</th>
                    <th>Quantity Sold</th>
                    <th>Total Revenue</th>
                    <th>Promotion Score</th>
                </tr>
            </thead>
            <tbody id="promotionTable">
                <!-- DATA:promotion_candidates_rows -->
            </tbody>
        </table>

        <!-- Key Insights -->
        <div class="section-header">Key Insights</div>
        <div class="insights-container" id="insightsContainer">
            <!-- DATA:insights_cards -->
        </div>

        <!-- Footer -->
        <div class="footer">
            Generated by Couqley Sales Analysis Tool — Omega POS Data
        </div>
    </div>

    <script>
        // Top Items Chart
        const topItemsCtx = document.getElementById('topItemsChart').getContext('2d');
        const topItemsChart = new Chart(topItemsCtx, {
            type: 'bar',
            data: {
                labels: <!-- DATA:top_items_labels -->,
                datasets: [{
                    label: 'Revenue ($)',
                    data: <!-- DATA:top_items_values -->,
                    backgroundColor: '#CC3333',
                    borderColor: '#BF9966',
                    borderWidth: 1,
                    borderRadius: 4
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: true,
                        labels: {
                            font: { family: "Georgia, serif", size: 12 }
                        }
                    }
                },
                scales: {
                    x: {
                        beginAtZero: true,
                        ticks: {
                            font: { family: "Georgia, serif", size: 11 }
                        }
                    },
                    y: {
                        ticks: {
                            font: { family: "Georgia, serif", size: 11 }
                        }
                    }
                }
            }
        });

        // Group Performance Doughnut Chart
        const groupCtx = document.getElementById('groupChart').getContext('2d');
        const groupChart = new Chart(groupCtx, {
            type: 'doughnut',
            data: {
                labels: <!-- DATA:group_labels -->,
                datasets: [{
                    data: <!-- DATA:group_values -->,
                    backgroundColor: [
                        '#CC3333',
                        '#BF9966',
                        '#4CAF50',
                        '#2196F3',
                        '#FF9800',
                        '#9C27B0'
                    ],
                    borderColor: '#FEFBF7',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: {
                            font: { family: "Georgia, serif", size: 12 },
                            padding: 15
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
